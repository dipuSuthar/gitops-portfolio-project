apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitops-app
  template:
    metadata:
      labels:
        app: gitops-app
    spec:
      containers:
      - name: web
        image: dilip001/gitops-app:fc13ce66d2230b5b7f5b87ebc298b336cf713580
        ports:
        - containerPort: 5000
        
        # Passing Environment Variables
        env:
        - name: REDIS_HOST
          value: "redis-service"  # Redis service ka naam
        - name: REDIS_PORT
          value: "6379"

        # Liveness Probe (Agar yeh fail hua toh K8s pod ko restart kar dega)
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10

        # Readiness Probe (Agar yeh fail hua toh K8s is pod par users nahi bhejega)
        readinessProbe:
          httpGet:
            path: /ready
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5