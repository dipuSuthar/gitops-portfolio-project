name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./app
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/gitops-app:${{ github.sha }}

    - name: Update Kubernetes Manifest with new Image Tag
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "bot@github.com"
        
        sed -i 's|image: .*/gitops-app:.*|image: ${{ secrets.DOCKER_USERNAME }}/gitops-app:${{ github.sha }}|g' k8s/app-deployment.yaml
        
        git commit -am "chore: update image tag to ${{ github.sha }}"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
