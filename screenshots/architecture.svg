<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker>
  </defs>
  <rect width="1120" height="620" fill="#ffffff"/>
  <text x="560" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#263238">GitOps CI/CD &amp; Observability Pipeline</text>
  <text x="560" y="64" text-anchor="middle" font-size="14" fill="#546e7a">GitHub Actions + ArgoCD + K3s on AWS EC2 + Prometheus / Grafana</text>

  <!-- AWS EC2 / K3s container -->
  <rect x="390" y="220" width="520" height="350" rx="12" fill="#f5f9ff" stroke="#1565c0" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="410" y="246" font-size="14" font-weight="bold" fill="#1565c0">AWS EC2 (t3.medium) - K3s Kubernetes cluster</text>

  <!-- Developer -->
  <rect x="40" y="250" width="120" height="60" rx="8" fill="#eceff1" stroke="#37474f" stroke-width="2"/>
  <text x="100" y="278" text-anchor="middle" font-size="15" font-weight="bold" fill="#263238">Developer</text>
  <text x="100" y="296" text-anchor="middle" font-size="12" fill="#455a64">git push</text>

  <!-- GitHub repo -->
  <rect x="210" y="250" width="140" height="60" rx="8" fill="#eceff1" stroke="#37474f" stroke-width="2"/>
  <text x="280" y="276" text-anchor="middle" font-size="15" font-weight="bold" fill="#263238">GitHub Repo</text>
  <text x="280" y="296" text-anchor="middle" font-size="12" fill="#455a64">app/ + k8s/ manifests</text>

  <!-- GitHub Actions -->
  <rect x="390" y="100" width="170" height="70" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="475" y="127" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b5e20">GitHub Actions (CI)</text>
  <text x="475" y="146" text-anchor="middle" font-size="12" fill="#2e7d32">build image, push,</text>
  <text x="475" y="161" text-anchor="middle" font-size="12" fill="#2e7d32">update tag in k8s/</text>

  <!-- Docker Hub -->
  <rect x="650" y="105" width="140" height="60" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="720" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d47a1">Docker Hub</text>
  <text x="720" y="149" text-anchor="middle" font-size="12" fill="#1565c0">container registry</text>

  <!-- ArgoCD -->
  <rect x="420" y="280" width="140" height="60" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="490" y="306" text-anchor="middle" font-size="15" font-weight="bold" fill="#e65100">ArgoCD</text>
  <text x="490" y="325" text-anchor="middle" font-size="12" fill="#ef6c00">auto-sync from Git</text>

  <!-- Flask -->
  <rect x="610" y="280" width="120" height="60" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="670" y="306" text-anchor="middle" font-size="15" font-weight="bold" fill="#4527a0">Flask App</text>
  <text x="670" y="325" text-anchor="middle" font-size="12" fill="#5e35b1">K8s Deployment</text>

  <!-- Redis -->
  <rect x="770" y="280" width="120" height="60" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="830" y="306" text-anchor="middle" font-size="15" font-weight="bold" fill="#b71c1c">Redis</text>
  <text x="830" y="325" text-anchor="middle" font-size="12" fill="#c62828">stateful datastore</text>

  <!-- Prometheus -->
  <rect x="420" y="440" width="150" height="70" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="495" y="468" text-anchor="middle" font-size="15" font-weight="bold" fill="#e65100">Prometheus</text>
  <text x="495" y="487" text-anchor="middle" font-size="12" fill="#ef6c00">scrapes node &amp;</text>
  <text x="495" y="502" text-anchor="middle" font-size="12" fill="#ef6c00">pod metrics</text>

  <!-- Grafana -->
  <rect x="640" y="440" width="150" height="70" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="715" y="468" text-anchor="middle" font-size="15" font-weight="bold" fill="#e65100">Grafana</text>
  <text x="715" y="487" text-anchor="middle" font-size="12" fill="#ef6c00">dashboards 1860, 15760</text>
  <text x="715" y="502" text-anchor="middle" font-size="12" fill="#ef6c00">+ CPU alert rule</text>

  <!-- Gmail -->
  <rect x="950" y="445" width="140" height="60" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="1020" y="471" text-anchor="middle" font-size="15" font-weight="bold" fill="#b71c1c">Gmail Alert</text>
  <text x="1020" y="490" text-anchor="middle" font-size="12" fill="#c62828">SMTP notification</text>

  <!-- Arrows -->
  <g stroke="#37474f" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="160" y1="280" x2="208" y2="280"/>
    <line x1="320" y1="250" x2="410" y2="172"/>
    <line x1="560" y1="135" x2="648" y2="135"/>
    <line x1="720" y1="166" x2="685" y2="278"/>
    <line x1="420" y1="305" x2="352" y2="290"/>
    <line x1="560" y1="310" x2="608" y2="310"/>
    <line x1="730" y1="310" x2="768" y2="310"/>
    <line x1="570" y1="475" x2="638" y2="475"/>
    <line x1="790" y1="475" x2="948" y2="475"/>
  </g>

  <!-- Arrow labels -->
  <g font-size="12" fill="#37474f">
    <text x="184" y="270" text-anchor="middle">1</text>
    <text x="352" y="200">2 trigger</text>
    <text x="604" y="125" text-anchor="middle">3 push image</text>
    <text x="726" y="215">4 pull image</text>
    <text x="386" y="272" text-anchor="middle">5 watch</text>
    <text x="584" y="302" text-anchor="middle">6</text>
    <text x="604" y="465" text-anchor="middle">7</text>
    <text x="868" y="465" text-anchor="middle">8 email</text>
  </g>

  <!-- Legend -->
  <text x="40" y="590" font-size="12" fill="#546e7a">Flow: 1 git push, 2 CI triggers, 3 image pushed, CI commits new tag to k8s/, 5 ArgoCD syncs cluster, 6 deploys app, 7 metrics to dashboards, 8 high-CPU alert email.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
